name: edit

on:
  workflow_dispatch: # Worker + manual "Run workflow" share these inputs
    inputs:
      kind:
        description: "new | fix | fix-dryrun | fix-apply | deliver"
        type: string
        required: true
        default: "new"
      chat_id:
        description: "Telegram chat id for delivery"
        type: string
        required: true
      url:
        description: "Drive/direct link (kind=new)"
        type: string
        default: ""
      video_file_id:
        description: "Telegram video file_id (kind=new, <=20MB)"
        type: string
        default: ""
      attachments:
        description: "JSON array of screenshot file_ids"
        type: string
        default: "[]"
      prompt:
        description: "Owner instruction for the edit"
        type: string
        default: ""
      state_ref:
        description: "state sha8 (kind=fix)"
        type: string
        default: ""
      instruction:
        description: "Correction text (kind=fix)"
        type: string
        default: ""

concurrency:
  group: vedit-${{ inputs.chat_id || 'manual' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # cross-run state artifact download on kind=fix

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and librsvg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin

      - name: Assert ASS filter available
        run: ffmpeg -filters | grep -q ass

      - name: Install Python deps
        run: python -m pip install -r requirements.txt

      - name: Download prior state (kind=fix*)
        if: inputs.kind == 'fix' || inputs.kind == 'fix-dryrun' || inputs.kind == 'fix-apply' || inputs.kind == 'deliver'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_REF: ${{ inputs.state_ref }}
        run: |
          set -euo pipefail
          if [ -z "$STATE_REF" ]; then
            echo "::error::kind=fix requires state_ref"
            exit 1
          fi
          ART=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?name=state-$STATE_REF")
          ID=$(jq -r '.artifacts[0].id // empty' <<<"$ART")
          if [ -z "$ID" ]; then
            echo "::error::no state artifact state-$STATE_REF"
            exit 1
          fi
          curl -sfL -H "Authorization: Bearer $GH_TOKEN" -o /tmp/state.zip \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip"
          mkdir -p out/run
          unzip -oq /tmp/state.zip -d out/run

      - name: Download preview (kind=fix-apply)
        if: inputs.kind == 'fix-apply'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_REF: ${{ inputs.state_ref }}
        run: |
          set -euo pipefail
          ART=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?name=preview-$STATE_REF")
          ID=$(jq -r '.artifacts[0].id // empty' <<<"$ART")
          if [ -z "$ID" ]; then
            echo "::error::no preview artifact preview-$STATE_REF — run fix-dryrun first"
            exit 1
          fi
          curl -sfL -H "Authorization: Bearer $GH_TOKEN" -o /tmp/preview.zip \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip"
          unzip -oq /tmp/preview.zip -d out/run

      - name: Download video artifact (kind=deliver)
        if: inputs.kind == 'deliver'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_REF: ${{ inputs.state_ref }}
        run: |
          set -euo pipefail
          ART=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?name=video-$STATE_REF")
          ID=$(jq -r '.artifacts[0].id // empty' <<<"$ART")
          if [ -z "$ID" ]; then
            echo "::error::no video artifact video-$STATE_REF (expired after 7 days?) — re-run apply to rebuild it"
            exit 1
          fi
          curl -sfL -H "Authorization: Bearer $GH_TOKEN" -o /tmp/video.zip \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip"
          unzip -oq /tmp/video.zip -d out/run

      - name: Download Telegram attachments
        if: inputs.attachments != '' && inputs.attachments != '[]'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ATTACHMENTS: ${{ inputs.attachments }}
        run: python -m vedit attach --state out/run --file-ids "$ATTACHMENTS"

      - name: Run pipeline
        id: run
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          KIND: ${{ inputs.kind }}
          IN_URL: ${{ inputs.url }}
          IN_FILE_ID: ${{ inputs.video_file_id }}
          IN_PROMPT: ${{ inputs.prompt }}
          INSTRUCTION: ${{ inputs.instruction }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |
          set -euo pipefail
          if [ "$KIND" = "fix" ]; then
            python -m vedit fix --state out/run --instruction "$INSTRUCTION" --chat-id "$CHAT_ID"
          elif [ "$KIND" = "fix-dryrun" ]; then
            python -m vedit fix --state out/run --instruction "$INSTRUCTION" --dry-run
          elif [ "$KIND" = "fix-apply" ]; then
            python -m vedit fix --state out/run --apply-preview --chat-id "$CHAT_ID"
          elif [ "$KIND" = "deliver" ]; then
            python -m vedit deliver --state out/run --chat-id "$CHAT_ID"
          else
            if [ -z "$IN_URL" ] && [ -z "$IN_FILE_ID" ]; then
              echo "::error::kind=new requires url or video_file_id"
              exit 1
            fi
            INPUT=""
            if [ -n "$IN_URL" ]; then INPUT="$IN_URL"; fi
            if [ -n "$IN_FILE_ID" ]; then INPUT="tg:$IN_FILE_ID"; fi
            python -m vedit process --input "$INPUT" --out out --name run \
              --prompt "$IN_PROMPT" --chat-id "$CHAT_ID"
          fi

      - name: Post dry-run confirmation to Telegram
        if: inputs.kind == 'fix-dryrun' && steps.run.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
          STATE_REF: ${{ inputs.state_ref }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import httpx

          from vedit.stage.fix import confirmation_text

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat = os.environ["CHAT_ID"]
          base = f"https://api.telegram.org/bot{token}"
          preview = json.loads(pathlib.Path("out/run/fix_preview.json").read_text())
          # state ref trailers every confirmation so replying to it resolves
          # the run even after the pending-confirm window expires.
          text = confirmation_text(preview)[:3900]
          text += f"\nstate {os.environ['STATE_REF']}"
          httpx.post(
              base + "/sendMessage",
              json={"chat_id": chat, "text": text},
              timeout=60,
          )
          frame = preview.get("frame")
          if frame:
              with (pathlib.Path("out/run") / frame).open("rb") as fh:
                  httpx.post(
                      base + "/sendPhoto",
                      data={"chat_id": chat},
                      files={"photo": ("preview.jpg", fh, "image/jpeg")},
                      timeout=120,
                  )
          PY

      - name: Send failure report to Telegram
        if: steps.run.outcome == 'failure' && inputs.chat_id != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import httpx

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat = os.environ["CHAT_ID"]
          base = f"https://api.telegram.org/bot{token}"
          report = pathlib.Path("out/run/edit_report.md")
          text = "run failed — no video produced"
          err_file = pathlib.Path("out/run/last_error.txt")
          if err_file.exists():
              text = err_file.read_text(encoding="utf-8")[:3500]
          else:
              preview_file = pathlib.Path("out/run/fix_preview.json")
              if preview_file.exists():
                  try:
                      preview = json.loads(preview_file.read_text(encoding="utf-8"))
                      if not preview.get("ok"):
                          text = f"can't do that yet: {preview.get('error', 'unknown error')}"
                  except ValueError:
                      pass
          if text.startswith("run failed"):
              if report.exists():
                  text = report.read_text(encoding="utf-8")[:3500]
          httpx.post(base + "/sendMessage", json={"chat_id": chat, "text": text}, timeout=60)
          if report.exists():
              with report.open("rb") as fh:
                  httpx.post(
                      base + "/sendDocument",
                      data={"chat_id": chat},
                      files={"document": ("edit_report.md", fh, "text/markdown")},
                      timeout=120,
                  )
          PY

      - name: Compute state ref
        id: ref
        if: steps.run.outcome == 'success'
        run: |
          SHA=$(jq -r .sha256 out/run/meta.json)
          echo "sha8=${SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Upload state artifact
        if: steps.run.outcome == 'success' && inputs.kind != 'fix-dryrun' && inputs.kind != 'deliver'
        uses: actions/upload-artifact@v4
        with:
          name: state-${{ steps.ref.outputs.sha8 }}
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
          path: |
            out/run/*.json
            out/run/*.md
            out/run/*.srt
            out/run/*.ass
            out/run/.done.transcribe
            out/run/.done.cut
            out/run/.done.plan
            out/run/icons/**
            out/run/attachments/**

      - name: Upload preview artifact (kind=fix-dryrun)
        if: steps.run.outcome == 'success' && inputs.kind == 'fix-dryrun'
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ inputs.state_ref }}
          retention-days: 30
          if-no-files-found: error
          path: |
            out/run/fix_preview.json
            out/run/preview/**

      - name: Upload video artifact
        if: steps.run.outcome == 'success' && inputs.kind != 'fix-dryrun' && inputs.kind != 'deliver'
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.ref.outputs.sha8 }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            out/run/final.mp4
            out/run/preview.mp4
            out/run/contact_sheet.jpg

      - name: Fail the job if the pipeline failed
        if: steps.run.outcome == 'failure'
        run: exit 1
