models:
  provider: groq
  transcribe: whisper-large-v3
  plan: openai/gpt-oss-120b
  visuals: openai/gpt-oss-120b

cuts:
  cut_gap_ms: 600
  keep_gap_ms: 350
  pad_ms: 120
  # segment-boundary crossfade; 0 = hard cut (legacy lossless concat).
  # Each join shortens the output by the overlap, accounted for in QC.
  crossfade_video_ms: 100
  crossfade_audio_ms: 50
  min_kept_segment_ms: 500
  min_output_s: 40
  adaptive_multiplier: 1.8
  pre_roll_ms: 80
  post_roll_ms: 140
  # silence assist (VAD cross-check on the RAW track — whisper stretches
  # word timings across real pauses, hiding them from the gap rules)
  silence_noise_db: -25
  silence_min_dur_ms: 400
  silence_merge_gap_ms: 250
  silence_pad_ms: 80
  word_drop_min_s: 0.5

audio:
  # mono extraction: speech-centric denoise/stt both downmix anyway, and
  # stereo masking can hide noise that mono processing would catch
  channels: 1
  highpass_hz: 80
  # low-shelf warmth lift before denoise (0 gain = disabled); boosted noise
  # is still cleaned up by afftdn downstream
  bass_boost_hz: 250
  bass_boost_gain_db: 4
  bass_boost_width: 1.5
  # FFT denoiser: nf = noise floor, nr = per-band reduction (ffmpeg default 12)
  afftdn_nf: -30
  denoise_reduction_db: 18
  comp_threshold_db: -18
  comp_ratio: 3
  comp_attack_ms: 10
  comp_release_ms: 200
  loudnorm_i: -16
  loudnorm_tp: -1.5
  loudnorm_lra: 11
  # extra gain after loudnorm (0 = off); positive gains are limited back to
  # loudnorm_tp so true peak never exceeds the ceiling
  volume_gain_db: 3
  # Named recipes for the Telegram /preset command (set_preset fix op).
  # Every recipe keeps the afftdn denoise stage: afftdn_nf and
  # denoise_reduction_db are intentionally untouched here (and rejected with
  # an error if a recipe ever sets them) — noise cancelling is the default.
  presets:
    clean_voice: # speech-forward: airier, mid compression, no mud
      bass_boost_gain_db: 0
      comp_threshold_db: -16
      comp_ratio: 3.5
      comp_release_ms: 150
      loudnorm_i: -16
      volume_gain_db: 3
    punchy: # louder + tighter for short-form social clips
      bass_boost_gain_db: 5
      comp_threshold_db: -20
      comp_ratio: 4
      comp_attack_ms: 8
      comp_release_ms: 120
      loudnorm_i: -14
      volume_gain_db: 4
    flat: # documentary neutral — minimal processing
      bass_boost_gain_db: 0
      comp_threshold_db: -24
      comp_ratio: 2
      loudnorm_i: -18
      volume_gain_db: 0

video:
  width: 1080
  height: 1920
  fps: 30
  x_frac: 0.5
  zoom_factor: 1.06
  max_zoom_segments_div: 4
  x264_preset: veryfast
  x264_crf: 20
  audio_bitrate: 192k
  # parallel segment encodes (segment files are independent)
  encode_workers: 2

visuals:
  icons_enabled: false # no Iconify overlays; only input images (screenshots) are placed
  # adaptive = reel-shaped shots fill the frame; other aspect ratios keep full
  # visibility on a blurred, aspect-filled backdrop (cover/overlay also work)
  screenshot_mode: adaptive # cover = crop to fill | adaptive = smart fit | overlay = floating box
  transitions: ["fade", "rise", "drift"] # cycled per visual; subtle only
  prefixes: lucide,ph
  search_limit: 32
  shortlist: 8
  density_window_s: 8
  max_visuals: 12
  icon_color: "#FFFFFF"
  icon_size: 200
  fade_s: 0.25
  screenshot_width_frac: 0.9
  placement_span_s: 2.5 # owner timestamp -> transcript phrase span ("place image 1 at 0:30")

captions:
  font: Inter-SemiBold
  font_size: 64
  max_chars: 32
  margin_v: 260
  primary_color: "&H00FFFFFF"
  emphasis_color: "&H004AD5FF"

qc:
  # frame-quantization + probe noise runs ~9ms per crossfade join; 0.25 fails
  # healthy renders past ~25 segments, so allow half a second (still tight
  # enough to catch a dropped/duplicated segment, which costs seconds).
  duration_tolerance_s: 0.5
  min_word_coverage: 0.95

limits:
  max_output_s: 90
  max_input_s: 1200
  telegram_download_max_bytes: 20971520
  telegram_send_max_bytes: 52428800

retry:
  llm_attempts: 4
  llm_backoff_s: 4
  http_attempts: 3
  http_backoff_s: 1

# Full-quality delivery: final.mp4 is uploaded to an S3-compatible store
# (Backblaze B2 by default — no card, 10GB free; R2 works too) and a
# time-limited presigned link is posted in chat. Telegram recompresses what
# it accepts, the stored file is bit-exact and the 50MB API cap doesn't apply.
# Credentials come from env R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY.
export:
  s3:
    enabled: true
    endpoint: https://s3.us-east-005.backblazeb2.com
    bucket: vedit-exports
    region: us-east-005
    expires_h: 72             # presigned link validity
    teaser: video             # video | document | none  (<=50MB chat copy)
